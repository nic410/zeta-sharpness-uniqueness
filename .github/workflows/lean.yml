# The Lean spine of Part II (paper/anc/lean). Part I's spine is a git dependency (its public repository, tag v1.3,
# pinned by commit in lakefile.lean and lake-manifest.json); Lake clones it with the other pinned packages.
name: Lean

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-audit:
    name: lake build + scripts/audit.sh
    runs-on: ubuntu-24.04
    # The first build compiles the needed Zeta23 modules from source (about 10 minutes on a 4-core runner); later runs
    # reuse the cache.
    timeout-minutes: 355
    defaults:
      run:
        shell: bash
        working-directory: paper/anc/lean
    env:
      # GitHub-hosted ubuntu-24.04 runners have 4 cores and 16 GB of RAM. Some Zeta23 modules
      # need several GB each to elaborate, so fewer threads per file plus swap avoid running out of memory.
      CORES: "0-3"
      LEAN_NUM_THREADS: "2"
    steps:
      - name: Free disk space
        working-directory: .
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache /usr/local/share/boost /usr/share/swift /usr/local/share/powershell \
            /usr/local/share/chromium /usr/local/lib/node_modules /opt/microsoft /opt/google /opt/az || true
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          df -h /

      - name: Add swap space (8 GB)
        working-directory: .
        run: |
          df -h / /mnt || true
          sudo swapoff -a || true
          sudo rm -f /swapfile /mnt/swapfile || true
          sudo fallocate -l 8G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h
          df -h / /mnt || true

      - name: Start resource monitor
        working-directory: .
        run: |
          nohup bash -c 'while true; do echo "[monitor $(date -u +%H:%M:%S)] $(free -m | awk "/Mem:/{print \"mem used \"\$3\" MB of \"\$2}") $(free -m | awk "/Swap:/{print \"swap used \"\$3\" MB\"}") disk $(df -h / | awk "NR==2{print \$4\" free\"}")"; sleep 60; done' > "$RUNNER_TEMP/monitor.log" 2>&1 &
          echo started

      - name: Check out
        uses: actions/checkout@v7

      - name: Install elan
        working-directory: .
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Restore the .lake cache
        uses: actions/cache/restore@v6
        with:
          path: paper/anc/lean/.lake
          key: lake-${{ runner.os }}-${{ hashFiles('paper/anc/lean/lake-manifest.json', 'paper/anc/lean/lean-toolchain') }}-${{ github.sha }}
          restore-keys: |
            lake-${{ runner.os }}-${{ hashFiles('paper/anc/lean/lake-manifest.json', 'paper/anc/lean/lean-toolchain') }}-

      - name: Download the Mathlib build cache
        run: |
          lake exe cache get
          # the compressed archives are no longer needed once unpacked
          rm -rf "$HOME/.cache/mathlib"
          df -h /

      - name: Build (PositivityRigidityII, Part I's spine and the Zeta23 dependency)
        timeout-minutes: 320
        run: |
          ( while true; do sleep 120; tail -n 1 "$RUNNER_TEMP/monitor.log" 2>/dev/null; done ) &
          lake build 2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Save the .lake cache
        if: always()
        uses: actions/cache/save@v6
        with:
          path: paper/anc/lean/.lake
          key: lake-${{ runner.os }}-${{ hashFiles('paper/anc/lean/lake-manifest.json', 'paper/anc/lean/lean-toolchain') }}-${{ github.sha }}

      - name: Audit
        run: scripts/audit.sh 2>&1 | tee "$RUNNER_TEMP/audit.log"

      - name: Upload the build and audit logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lean-logs
          path: |
            ${{ runner.temp }}/audit.log
            ${{ runner.temp }}/build.log
            ${{ runner.temp }}/monitor.log
          if-no-files-found: warn
